name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            machine: x86_64
            runner: ubuntu-24.04
          - goarch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Verify AVX2 support
        if: matrix.goarch == 'amd64'
        run: grep -qw avx2 /proc/cpuinfo

      - name: Run tests
        run: go test -count=1 ./...

  generic-build:
    name: Compile linux/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        goarch:
          - "386"
          - ppc64le
          - riscv64
          - s390x

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile tests
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: linux
        run: go test -exec=true ./...
